name: SilverStripe CodeGuard

on:
  workflow_call:
    inputs:
      project-type:
        description: SilverStripe project type
        required: false
        type: string
        default: module

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install project dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test -- --no-coverage

      - name: Run CodeGuard quality gate
        shell: bash
        env:
          CODEGUARD_PROJECT_TYPE: ${{ inputs.project-type || 'module' }}
        run: |
          set -o pipefail
          if [ ! -x ./vendor/bin/silverstripe-codeguard ]; then
            echo "Install clesson-de/silverstripe-codeguard as a Composer dependency before calling this workflow." >&2
            exit 1
          fi
          ./vendor/bin/silverstripe-codeguard gate --type="$CODEGUARD_PROJECT_TYPE" --format=json | tee codeguard-report.json

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silverstripe-codeguard-report
          path: codeguard-report.json
          if-no-files-found: ignore
